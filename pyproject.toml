[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-assistant"
version = "1.1.0"
description = "A pure-Python, interview-ready RAG document assistant with retrieval and RAG triad evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
keywords = ["rag", "fastapi", "faiss", "sentence-transformers", "ollama", "evals"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.5.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.1.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "flake8>=7.0.0",
]

[project.scripts]
rag-server = "app:start"
rag-eval = "evals.evaluate:run_eval"

[tool.setuptools]
py-modules = ["app", "evaluate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
