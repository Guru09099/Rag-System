<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Document Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- React 18 & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #111827;
      --bg-input: #0b1120;
      --border: #1f2937;
      --border-accent: #374151;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --text-bright: #ffffff;
      --badge-bg: #1f2937;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    #root { width: 100%; max-width: 980px; }
    
    /* Layout */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .brand h1 { font-size: 1.6rem; color: var(--text-bright); display: flex; align-items: center; gap: 0.5rem; }
    .brand p { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
    
    .status-pill { display: flex; align-items: center; gap: 0.5rem; background: var(--badge-bg); border: 1px solid var(--border); padding: 0.4rem 0.85rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #eab308; }
    .dot.ready { background: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    
    /* Tabs */
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 0.95rem; font-weight: 600; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.4rem; }
    .tab-btn:hover { color: var(--text-bright); background: rgba(255, 255, 255, 0.04); }
    .tab-btn.active { color: var(--primary); background: rgba(34, 197, 94, 0.1); }
    
    /* Cards */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    .card-title { font-size: 1.15rem; font-weight: 600; color: var(--text-bright); margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
    
    /* Inputs & Buttons */
    textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-bright); padding: 0.85rem; font-size: 0.95rem; outline: none; resize: vertical; min-height: 90px; }
    textarea:focus { border-color: var(--primary); }
    
    .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; gap: 1rem; flex-wrap: wrap; }
    .btn { background: var(--primary); color: #000; border: none; border-radius: 6px; padding: 0.65rem 1.4rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: background 0.15s; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--badge-bg); color: var(--text-bright); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border-accent); }
    
    select { background: var(--bg-input); color: var(--text-bright); border: 1px solid var(--border); padding: 0.5rem 0.8rem; border-radius: 6px; outline: none; font-size: 0.9rem; }
    
    /* Q&A Results */
    .answer-container { background: rgba(17, 24, 39, 0.8); border-left: 4px solid var(--primary); border-radius: 0 8px 8px 0; padding: 1.2rem; margin-top: 1rem; line-height: 1.6; }
    .answer-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); font-weight: 700; margin-bottom: 0.5rem; }
    .answer-text { color: var(--text-bright); font-size: 1rem; white-space: pre-wrap; }
    
    /* Source Cards */
    .sources-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .source-card { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-size: 0.88rem; }
    .source-meta { display: flex; justify-content: space-between; font-weight: 600; color: #60a5fa; margin-bottom: 0.5rem; font-size: 0.82rem; }
    .source-text { color: var(--text-muted); line-height: 1.5; font-size: 0.85rem; }
    
    /* Document List */
    .doc-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
    .doc-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    
    /* Metrics Grid */
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .metric-card { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
    .metric-val { font-size: 1.6rem; font-weight: 700; color: var(--text-bright); margin-top: 0.3rem; }
    .metric-label { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .chart-img { width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Separate React JS File -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
